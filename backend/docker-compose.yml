version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: brandguard-db
    environment:
      POSTGRES_USER: brandguard
      POSTGRES_PASSWORD: brandguard_dev_password
      POSTGRES_DB: brandguard
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brandguard -d brandguard"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: brandguard-api
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://brandguard:brandguard_dev_password@db:5432/brandguard
      ENVIRONMENT: development
      LOG_LEVEL: INFO
      CORS_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
